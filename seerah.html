<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض السورة — ملاك المعرفة</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
.surah-header{background:linear-gradient(135deg,rgba(212,175,55,0.2) 0%,rgba(212,175,55,0.05) 100%);border:1px solid rgba(212,175,55,0.35);border-radius:20px;padding:25px 20px;text-align:center;margin-bottom:20px}
.surah-header h1{font-family:'Amiri',serif;font-size:34px;color:var(--gold);margin-bottom:10px}
.surah-header .meta-line{color:var(--cream);opacity:0.8;font-size:14px}
.surah-nav{display:flex;justify-content:space-between;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.nav-btn{flex:1;min-width:120px;padding:10px 15px;background:rgba(26,107,84,0.5);border:1px solid rgba(212,175,55,0.3);border-radius:10px;color:var(--gold);text-decoration:none;text-align:center;font-family:inherit;font-size:14px;cursor:pointer;transition:all 0.3s}
.nav-btn:hover{background:var(--gold);color:var(--green-dark)}

/* شريط الموضع الحالي — ثابت أسفل الشاشة */
.position-bar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(10,58,44,0.98) 0%,rgba(13,77,60,0.98) 100%);border:2px solid var(--gold);border-radius:25px;padding:8px 18px;z-index:1000;display:none;align-items:center;gap:12px;box-shadow:0 8px 25px rgba(0,0,0,0.5);animation:barIn 0.3s ease}
.position-bar.show{display:flex}
@keyframes barIn{from{opacity:0;transform:translateX(-50%) translateY(15px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.position-bar .label{color:var(--cream);font-size:12px;white-space:nowrap}
.position-bar .ayah-num{color:var(--gold);font-weight:700;font-size:15px}
.position-bar .actions{display:flex;gap:6px}
.position-bar .mini-btn{background:rgba(212,175,55,0.2);border:1px solid rgba(212,175,55,0.5);color:var(--gold);padding:5px 12px;border-radius:15px;font-family:inherit;font-size:11px;cursor:pointer;transition:all 0.3s}
.position-bar .mini-btn:hover{background:var(--gold);color:var(--green-dark)}
.position-bar .saved-tick{background:rgba(74,222,128,0.2);color:#4ade80;border-color:rgba(74,222,128,0.5);padding:5px 10px;border-radius:15px;font-size:11px}

/* بانر الاستئناف */
.resume-banner{display:none;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(74,222,128,0.18) 0%,rgba(34,197,94,0.08) 100%);border:2px solid rgba(74,222,128,0.5);border-radius:14px;padding:14px 18px;margin-bottom:20px;flex-wrap:wrap}
.resume-banner.show{display:flex}
.resume-icon{font-size:22px}
.resume-text{flex:1;color:var(--cream);font-size:14px;line-height:1.6}
.resume-text strong{color:#4ade80;font-weight:700}
.resume-btn{background:linear-gradient(135deg,#4ade80 0%,#22c55e 100%);color:white;border:none;padding:8px 18px;border-radius:20px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.3s}
.resume-btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(74,222,128,0.4)}
.resume-dismiss{background:transparent;border:1px solid rgba(212,175,55,0.4);color:var(--gold);width:30px;height:30px;border-radius:50%;cursor:pointer;font-family:inherit;font-size:14px}

.controls{background:rgba(10,58,44,0.6);border:1px solid rgba(212,175,55,0.25);border-radius:15px;padding:20px;margin-bottom:25px}
.control-row{display:flex;align-items:center;gap:12px;margin-bottom:15px;flex-wrap:wrap}
.control-row:last-child{margin-bottom:0}
.control-label{color:var(--gold);font-size:14px;font-weight:600;min-width:90px}
.control-row select{flex:1;min-width:180px;padding:10px 14px;background:rgba(13,77,60,0.9);border:1px solid rgba(212,175,55,0.3);border-radius:10px;color:var(--cream);font-family:inherit;font-size:14px;cursor:pointer;outline:none}
.control-row select:focus{border-color:var(--gold)}
.repeat-row{background:rgba(212,175,55,0.06);border:1px dashed rgba(212,175,55,0.35);border-radius:12px;padding:14px}
.repeat-inputs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1}
.repeat-inputs span{color:var(--cream);font-size:13px;opacity:0.85}
.repeat-inputs input[type="number"]{width:75px;padding:8px 10px;background:rgba(13,77,60,0.9);border:1px solid rgba(212,175,55,0.3);border-radius:8px;color:var(--gold);font-family:inherit;font-size:15px;font-weight:700;text-align:center;outline:none}
.repeat-inputs input[type="number"]:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,0.15)}
.repeat-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:6px 12px;background:rgba(10,58,44,0.7);border-radius:20px;border:1px solid rgba(212,175,55,0.3);transition:all 0.3s}
.repeat-toggle input{display:none}
.repeat-toggle .toggle-box{width:20px;height:20px;border:2px solid var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all 0.3s;flex-shrink:0}
.repeat-toggle .toggle-box::after{content:'✓';color:var(--green-dark);font-weight:700;font-size:13px;opacity:0;transition:opacity 0.2s}
.repeat-toggle input:checked ~ .toggle-box{background:var(--gold);border-color:var(--gold)}
.repeat-toggle input:checked ~ .toggle-box::after{opacity:1}
.repeat-toggle span{color:var(--cream);font-size:13px;font-weight:600}
.repeat-toggle.active{background:rgba(212,175,55,0.2);border-color:var(--gold)}
.btn-play{flex:1;min-width:180px;padding:12px 20px;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);color:var(--green-dark);font-weight:700;border:none;border-radius:10px;font-family:inherit;font-size:15px;cursor:pointer;transition:all 0.3s}
.btn-play:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(212,175,55,0.4)}
.btn-stop{flex:1;min-width:180px;padding:12px 20px;background:rgba(200,50,50,0.85);color:white;font-weight:700;border:none;border-radius:10px;font-family:inherit;font-size:15px;cursor:pointer;display:none;transition:all 0.3s}
.btn-stop:hover{background:rgba(220,60,60,1)}
.playing-info{text-align:center;padding:12px;color:var(--gold);font-size:14px;display:none;margin-top:12px;border-top:1px dashed rgba(212,175,55,0.3);font-weight:600}
.playing-info.show{display:block}
.playing-info .loop-badge{display:inline-block;background:rgba(74,222,128,0.2);color:#4ade80;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:8px;border:1px solid rgba(74,222,128,0.4)}
.basmala{text-align:center;font-family:'Amiri',serif;font-size:28px;color:var(--gold);margin:30px 0;padding:20px;border-top:1px solid rgba(212,175,55,0.3);border-bottom:1px solid rgba(212,175,55,0.3)}
.ayah{background:linear-gradient(135deg,rgba(26,107,84,0.25) 0%,rgba(13,77,60,0.4) 100%);border-right:4px solid var(--gold);border-radius:12px;padding:20px;margin-bottom:15px;transition:all 0.35s;position:relative}
.ayah:hover{background:linear-gradient(135deg,rgba(26,107,84,0.4) 0%,rgba(13,77,60,0.6) 100%);box-shadow:0 4px 15px rgba(212,175,55,0.15)}
.ayah.playing{border-right-color:#ff6b6b;background:linear-gradient(135deg,rgba(200,50,50,0.25) 0%,rgba(150,30,30,0.35) 100%);box-shadow:0 0 22px rgba(255,107,107,0.35);transform:scale(1.01)}
.ayah.saved-marker{border-right-color:#4ade80;border-right-width:6px}
.ayah.saved-marker::after{content:'📍';position:absolute;top:8px;left:8px;font-size:18px}
.ayah-text{font-family:'Amiri','Scheherazade New',serif;font-size:26px;line-height:2.2;color:var(--cream);text-align:justify;margin-bottom:15px;padding-right:15px;position:relative}
.ayah-number-badge{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);color:var(--green-dark);border-radius:50%;font-family:'Amiri',serif;font-weight:700;font-size:14px;margin-right:12px;vertical-align:middle}
.ayah-actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px dashed rgba(212,175,55,0.2)}
.ayah-action-btn{padding:6px 14px;background:rgba(10,58,44,0.7);border:1px solid rgba(212,175,55,0.3);border-radius:20px;color:var(--gold);font-size:12px;font-family:inherit;cursor:pointer;transition:all 0.3s}
.ayah-action-btn:hover{background:var(--gold);color:var(--green-dark)}
.ayah-action-btn.save-btn{border-color:rgba(74,222,128,0.4);color:#4ade80}
.ayah-action-btn.save-btn:hover{background:#4ade80;color:white}
.tafsir-box{background:rgba(10,58,44,0.9);border:1px solid rgba(212,175,55,0.3);border-radius:10px;padding:15px;margin-top:12px;display:none;font-size:15px;line-height:1.9;color:var(--cream)}
.tafsir-box.show{display:block}
.tafsir-box strong{color:var(--gold);display:block;margin-bottom:8px;font-size:14px}
.loading{text-align:center;padding:60px 20px;color:var(--gold)}
.spinner{display:inline-block;width:50px;height:50px;border:4px solid rgba(212,175,55,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{text-align:center;padding:40px 20px;color:#ff6b6b;font-size:16px}
@media (max-width:640px){
.ayah-text{font-size:22px;line-height:2}
.surah-header h1{font-size:26px}
.control-row{flex-direction:column;align-items:stretch}
.control-label{min-width:auto}
.repeat-inputs{justify-content:center}
.position-bar{bottom:8px;padding:6px 12px;gap:8px}
.position-bar .label{font-size:11px}
.position-bar .ayah-num{font-size:13px}
}
</style>
</head>

<div class="header-container">

</div>

</div>
