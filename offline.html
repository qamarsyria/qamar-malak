<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غير متصل — ملاك المعرفة</title>
<link rel="stylesheet" href="style.css">
<style>
.offline-wrap{max-width:600px;margin:60px auto;text-align:center;padding:30px 20px;background:linear-gradient(135deg,rgba(212,175,55,0.15) 0%,rgba(13,77,60,0.4) 100%);border:2px solid rgba(212,175,55,0.35);border-radius:24px}
.offline-icon{font-size:80px;margin-bottom:20px;display:block}
.offline-wrap h1{font-family:'Amiri',serif;font-size:28px;color:var(--gold);margin-bottom:15px}
.offline-wrap p{color:var(--cream);opacity:0.9;font-size:16px;line-height:1.9;margin-bottom:20px}
.offline-wrap .ayah{font-family:'Amiri',serif;font-size:20px;color:var(--gold);padding:20px;background:rgba(10,58,44,0.6);border-radius:12px;margin:20px 0}
.offline-actions{margin-top:30px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.offline-btn{display:inline-block;padding:14px 30px;background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);color:var(--green-dark);text-decoration:none;border-radius:30px;font-weight:700;font-size:15px}
.offline-btn.secondary{background:transparent;color:var(--gold);border:2px solid var(--gold)}
</style>
</head>
<body>

<header class="site-header">
<div class="header-container">
<a href="index.html" class="logo">
<div class="logo-icon">☪</div>
<div class="logo-text">
<span class="main">ملاك المعرفة</span>
<span class="sub">منصة إسلامية شاملة</span>
</div>
</a>
</div>
</header>

<main class="main-container">
<div class="offline-wrap">
<span class="offline-icon">📡</span>
<h1>أنت غير متصل بالإنترنت</h1>
<p>الصفحات التي زرتها سابقاً متاحة بدون إنترنت. أما المحتوى الجديد فيحتاج اتصالاً.</p>

<div class="ayah">﴿ وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ ﴾</div>

<div class="offline-actions">
<a href="index.html" class="offline-btn">🏠 الرئيسية</a>
<a href="adhkar.html" class="offline-btn secondary">🤲 الأذكار</a>
</div>

<p style="margin-top:30px;font-size:13px;opacity:0.6">تأكد من الاتصال بالإنترنت، ثم أعد المحاولة.</p>
</div>
</main>

</body>
</html>
