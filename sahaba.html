<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصحابة الكرام — ملاك المعرفة</title>
<meta name="description" content="سير الصحابة الكرام رضي الله عنهم — الخلفاء الراشدون، العشرة المبشرون بالجنة، أمهات المؤمنين، رواة الحديث، والسابقون الأولون بمصادر موثقة.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<meta name="theme-color" content="#0b4133">
<style>
.sahaba-hero {
    background: var(--bg-card);
    border: 1.5px solid var(--border-strong);
    border-radius: 20px;
    padding: 32px 20px;
    text-align: center;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
}
.sahaba-hero h1 {
    font-family: 'Amiri', serif;
    font-size: 32px;
    color: var(--text-accent);
    margin-bottom: 10px;
}
.sahaba-hero p {
    color: var(--text-muted);
    max-width: 720px;
    margin: 0 auto;
    font-size: 14.5px;
    line-height: 1.85;
}

.search-box {
    max-width: 520px;
    margin: 0 auto 20px;
    position: relative;
}
.search-box input {
    width: 100%;
    padding: 14px 48px 14px 18px;
    background: var(--bg-input);
    border: 2px solid var(--border-soft);
    border-radius: 30px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.25s;
}
.search-box input:focus { border-color: var(--gold); }
.search-box .search-icon {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-accent);
    font-size: 18px;
    pointer-events: none;
}

.filters {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 22px;
}
.filter-btn {
    padding: 8px 15px;
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    color: var(--text-main);
    border-radius: 22px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
}
.filter-btn:hover,
.filter-btn.active {
    background: var(--gold);
    color: var(--text-on-gold);
    border-color: var(--gold);
}

.count-note {
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
    margin-bottom: 18px;
}
.count-note strong { color: var(--text-accent); }

.sahaba-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
    gap: 16px;
}
.sahabi-card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 20px;
    transition: all 0.25s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}
.sahabi-card::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 4px;
    height: 100%;
    background: var(--gold);
    transform: scaleY(0);
    transition: transform 0.25s;
    transform-origin: top;
}
.sahabi-card:hover {
    transform: translateY(-4px);
    border-color: var(--gold);
    box-shadow: var(--shadow-gold);
}
.sahabi-card:hover::before { transform: scaleY(1); }

.sahabi-icon {
    width: 52px;
    height: 52px;
    background: rgba(212, 175, 55, 0.16);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 12px;
    border: 1px solid var(--border-soft);
}
.sahabi-name {
    font-family: 'Amiri', serif;
    font-size: 22px;
    color: var(--text-accent);
    margin-bottom: 4px;
    font-weight: 700;
}
.sahabi-title {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 10px;
    font-weight: 600;
}
.sahabi-brief {
    font-size: 13.8px;
    line-height: 1.75;
    color: var(--text-main);
    opacity: 0.9;
    flex: 1;
}
.sahabi-badge {
    display: inline-block;
    align-self: flex-start;
    background: rgba(212, 175, 55, 0.14);
    color: var(--text-accent);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    margin-top: 12px;
    border: 1px solid var(--border-soft);
}

.no-results {
    text-align: center;
    padding: 45px 20px;
    color: var(--text-muted);
    grid-column: 1 / -1;
}

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(6px);
    z-index: 3000;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    overflow-y: auto;
}
.modal-overlay.show { display: flex; }
.modal-content {
    background: var(--bg-dropdown);
    border: 2px solid var(--gold);
    border-radius: 20px;
    max-width: 760px;
    width: 100%;
    padding: 28px 24px;
    position: relative;
    margin: 24px auto;
}
.modal-close {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(220, 38, 38, 0.85);
    color: #fff;
    border: none;
    font-size: 18px;
    cursor: pointer;
}
.modal-icon { font-size: 52px; text-align: center; margin-bottom: 10px; }
.modal-name {
    font-family: 'Amiri', serif;
    font-size: 30px;
    color: var(--text-accent);
    text-align: center;
    margin-bottom: 6px;
}
.modal-title {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 22px;
}
.modal-section {
    margin-bottom: 16px;
    padding: 16px 18px;
    background: var(--bg-panel);
    border-radius: 12px;
    border-right: 4px solid var(--gold);
}
.modal-section h3 {
    font-family: 'Amiri', serif;
    font-size: 18px;
    color: var(--text-accent);
    margin-bottom: 8px;
}
.modal-section p {
    color: var(--text-main);
    line-height: 1.9;
    font-size: 15px;
}
.modal-source {
    font-size: 13px;
    color: var(--text-accent);
    text-align: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--border-soft);
}

@media (max-width: 640px) {
    .sahaba-hero h1 { font-size: 24px; }
    .sahaba-grid { grid-template-columns: 1fr; }
    .modal-content { padding: 20px 15px; }
    .modal-name { font-size: 24px; }
}
</style>
</head>
<body>

<div id="app-header"></div>
<div id="app-nav"></div>

<main class="main-container">

<section class="sahaba-hero">
    <h1>⭐ الصحابة الكرام رضي الله عنهم</h1>
    <p>سير أصحاب النبي محمد ﷺ وأمهات المؤمنين — الخلفاء الراشدون، العشرة المبشرون بالجنة، رواة الحديث، والسابقون الأولون — محرّرة وموثّقة من الصحيحين وكتب السير المعتمدة.</p>
</section>

<div class="search-box">
    <input type="text" id="search-input" placeholder="ابحث عن صحابي بالاسم أو اللقب...">
    <span class="search-icon">🔍</span>
</div>

<div class="filters" id="filters"></div>
<div class="count-note" id="count-note"></div>
<div class="sahaba-grid" id="sahaba-container"></div>

</main>

<footer id="app-footer"></footer>

<div class="modal-overlay" id="modal">
    <div class="modal-content" id="modal-content"></div>
</div>

<script src="layout.js"></script>
<script src="data/sahaba-data.js"></script>
<script>
(function () {
'use strict';

const SAHABA = window.SAHABA_DATA || [];
if (!SAHABA.length) {
    document.getElementById('sahaba-container').innerHTML =
        '<div class="no-results">⚠️ تعذر تحميل ملف data/sahaba-data.js.</div>';
    return;
}

let currentFilter = 'all';
let currentSearch = '';

function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = String(t || '');
    return d.innerHTML;
}

function renderFilters() {
    const cats = ['all', ...new Set(SAHABA.map(s => s.category))];
    const wrap = document.getElementById('filters');
    wrap.innerHTML = cats.map(c => {
        const count = c === 'all' ? SAHABA.length : SAHABA.filter(s => s.category === c).length;
        const label = c === 'all' ? 'الكل' : c;
        return `<button type="button" class="filter-btn ${c === currentFilter ? 'active' : ''}" data-filter="${escapeHtml(c)}">${escapeHtml(label)} (${count})</button>`;
    }).join('');

    wrap.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            currentFilter = btn.dataset.filter;
            renderFilters();
            renderSahaba();
        });
    });
}

function renderSahaba() {
    const container = document.getElementById('sahaba-container');
    const q = currentSearch.trim();
    const filtered = SAHABA.filter(s => {
        const matchFilter = currentFilter === 'all' || s.category === currentFilter;
        const matchSearch = q === '' ||
            s.name.includes(q) ||
            s.title.includes(q) ||
            s.brief.includes(q);
        return matchFilter && matchSearch;
    });

    document.getElementById('count-note').innerHTML =
        `عرض <strong>${filtered.length}</strong> من أصل <strong>${SAHABA.length}</strong> ترجمة موثّقة`;

    if (filtered.length === 0) {
        container.innerHTML = '<div class="no-results">🔍 لا توجد نتائج مطابقة للبحث.</div>';
        return;
    }

    container.innerHTML = filtered.map(s => {
        const idx = SAHABA.indexOf(s);
        return `
            <article class="sahabi-card" data-idx="${idx}">
                <div class="sahabi-icon">${s.icon}</div>
                <div class="sahabi-name">${escapeHtml(s.name)}</div>
                <div class="sahabi-title">${escapeHtml(s.title)}</div>
                <div class="sahabi-brief">${escapeHtml(s.brief)}</div>
                <span class="sahabi-badge">${escapeHtml(s.category)}</span>
            </article>
        `;
    }).join('');

    container.querySelectorAll('.sahabi-card').forEach(card => {
        card.addEventListener('click', () => openModal(parseInt(card.dataset.idx, 10)));
    });
}

function openModal(index) {
    const s = SAHABA[index];
    if (!s) return;
    const modal = document.getElementById('modal');
    const content = document.getElementById('modal-content');

    content.innerHTML = `
        <button type="button" class="modal-close" id="modal-close-btn">✕</button>
        <div class="modal-icon">${s.icon}</div>
        <div class="modal-name">${escapeHtml(s.name)}</div>
        <div class="modal-title">${escapeHtml(s.title)}</div>
        ${(s.sections || []).map(sec => `
            <div class="modal-section">
                <h3>${escapeHtml(sec.h)}</h3>
                <p>${escapeHtml(sec.p)}</p>
            </div>
        `).join('')}
        <div class="modal-source">📚 المصادر: ${escapeHtml(s.refs)}</div>
    `;

    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
    document.body.style.overflow = '';
}

document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeModal();
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});

document.getElementById('search-input').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderSahaba();
});

renderFilters();
renderSahaba();

})();
</script>
</body>
</html>
