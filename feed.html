<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>فيديوهات ملاك المعرفة</title>
<link rel="stylesheet" href="style.css">
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
        font-family: 'Tajawal', sans-serif;
    }
    .feed-container {
        height: 100vh;
        width: 100vw;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scrollbar-width: none; 
    }
    .feed-container::-webkit-scrollbar {
        display: none; 
    }
    .video-card {
        height: 100vh;
        width: 100vw;
        scroll-snap-align: start;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #000;
    }
    .video-element {
        width: 100%;
        height: 100%;
        object-fit: cover; 
    }
    .video-placeholder {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1A3A5C 0%, #0F766E 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #D4AF37;
        text-align: center;
        padding: 20px;
    }
    .video-placeholder h2 { font-family: 'Amiri', serif; font-size: 28px; margin-bottom: 15px; }
    .video-info {
        position: absolute;
        bottom: 60px;
        right: 0;
        left: 0;
        padding: 20px;
        background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        color: #fff;
        pointer-events: none;
    }
    .video-title {
        font-family: 'Amiri', serif;
        font-size: 24px;
        font-weight: bold;
        color: #D4AF37;
        margin-bottom: 8px;
        text-shadow: 1px 1px 2px #000;
    }
    .video-desc {
        font-size: 14px;
        line-height: 1.6;
        opacity: 0.9;
        text-shadow: 1px 1px 2px #000;
    }
    .video-category {
        display: inline-block;
        background: rgba(212, 175, 55, 0.2);
        color: #D4AF37;
        border: 1px solid #D4AF37;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 12px;
        margin-bottom: 10px;
    }
    .back-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.2);
        width: 45px;
        height: 45px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        cursor: pointer;
        z-index: 1000;
        backdrop-filter: blur(5px);
        text-decoration: none;
    }
    .loading-screen {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #0d4d3c;
        color: #D4AF37;
    }
    .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(212, 175, 55, 0.2);
        border-top-color: #D4AF37;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .audio-toggle {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0,0,0,0.5);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        font-size: 18px;
        cursor: pointer;
        z-index: 100;
        backdrop-filter: blur(5px);
    }
</style>
</head>
<body>

<a href="index.html" class="back-btn">↩</a>

<div id="loading" class="loading-screen">
    <div class="spinner"></div>
    <p>جاري تحميل الفيديوهات...</p>
</div>

<div id="feed" class="feed-container" style="display: none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
<script>
    const SUPABASE_URL = 'https://mhmybkdghxamtviojxjd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_dSCH3FinzsLnhvPfWiDqbg_lrqT_erA'; 

    function showError(msg) {
        const loading = document.getElementById('loading');
        loading.innerHTML = `<div style="color:#ff8888; text-align:center; padding:20px;">
            <h2 style="font-family:Amiri,serif; font-size:24px;">⚠️ حدث خطأ</h2>
            <p style="line-height:1.8; margin-top:10px;">${msg}</p>
            <button onclick="location.reload()" style="margin-top:20px; padding:10px 20px; border-radius:8px; border:none; background:#D4AF37; color:#000; font-weight:bold; cursor:pointer;">إعادة المحاولة</button>
        </div>`;
    }

    async function loadVideos() {
        try {
            if (typeof window.supabase === 'undefined') {
                throw new Error("لم يتمكن الموقع من تحميل مكتبة قاعدة البيانات. تأكد من قوة الإنترنت.");
            }

            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const feedContainer = document.getElementById('feed');
            const loadingScreen = document.getElementById('loading');

            const timeout = new Promise((_, reject) => 
                setTimeout(() => reject(new Error("انتهت مهلة الاتصال بقاعدة البيانات. قد يكون الاتصال ضعيفاً.")), 15000)
            );

            const fetchData = supabaseClient.from('videos').select('*').order('created_at', { ascending: false });
            const { data: videos, error } = await Promise.race([fetchData, timeout]);

            if (error) throw error;

            loadingScreen.style.display = 'none';
            feedContainer.style.display = 'block';

            if (!videos || videos.length === 0) {
                feedContainer.innerHTML = `
                    <div class="video-card" style="flex-direction:column; color:#D4AF37; text-align:center;">
                        <h2 style="font-family:Amiri,serif; font-size:28px; margin-bottom:10px;">لا توجد فيديوهات بعد</h2>
                        <p style="opacity:0.8;">سيقوم المصنع برفع الفيديوهات هنا قريباً جداً بمشيئة الله.</p>
                        <a href="index.html" style="margin-top:20px; padding:10px 20px; background:#D4AF37; color:#000; text-decoration:none; border-radius:8px; font-weight:bold;">العودة للرئيسية</a>
                    </div>
                `;
                return;
            }

            let html = '';
            videos.forEach((video) => {
                const hasVideoUrl = video.video_url && video.video_url.trim() !== '';
                html += `
                    <div class="video-card">
                        ${hasVideoUrl ? `
                            <video class="video-element" src="${video.video_url}" loop muted playsinline preload="metadata" onclick="togglePlay(this)"></video>
                            <button class="audio-toggle" onclick="toggleMute(this)">🔇</button>
                        ` : `
                            <div class="video-placeholder">
                                <h2>${video.title || 'فيديو'}</h2>
                                <p>جاري تجهيز رابط الفيديو...</p>
                            </div>
                        `}
                        <div class="video-info">
                            ${video.category ? `<span class="video-category">${video.category}</span>` : ''}
                            <div class="video-title">${video.title || 'بدون عنوان'}</div>
                            <div class="video-desc">${video.description || ''}</div>
                        </div>
                    </div>
                `;
            });

            feedContainer.innerHTML = html;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (!video) return;
                    if (entry.isIntersecting) video.play().catch(e => {});
                    else video.pause();
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('.video-card').forEach(card => observer.observe(card));

        } catch (err) {
            showError(err.message);
        }
    }

    function togglePlay(videoEl) {
        if (videoEl.paused) videoEl.play();
        else videoEl.pause();
    }

    function toggleMute(btn) {
        const video = btn.parentElement.querySelector('video');
        if (video.muted) { video.muted = false; btn.textContent = '🔊'; }
        else { video.muted = true; btn.textContent = '🔇'; }
    }

    loadVideos();
</script>
</body>
</html>
