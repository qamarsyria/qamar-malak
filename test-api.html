<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار API</title>
<style>
body{font-family:sans-serif;padding:20px;background:#0a3a2c;color:#f5f0e1}
h1{color:#d4af37}
button{background:#d4af37;color:#0a3a2c;border:none;padding:14px 24px;border-radius:25px;font-size:16px;font-weight:700;cursor:pointer;margin:10px 5px;width:100%}
button:disabled{opacity:0.5}
pre{background:#000;color:#0f0;padding:15px;border-radius:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;font-size:12px;direction:ltr;text-align:left;max-height:600px}
.status{padding:12px;border-radius:8px;margin:10px 0;font-weight:700;text-align:center}
.status.loading{background:rgba(212,175,55,0.2);border:1px solid #d4af37}
.status.ok{background:rgba(74,222,128,0.25);border:2px solid #4ade80;color:#4ade80}
.status.err{background:rgba(220,60,60,0.2);border:1px solid #ff6b6b;color:#ff8888}
</style>
</head>
<body>
<h1>🔍 اختبار API</h1>

<button id="test1">1️⃣ اختبار الخادم</button>
<button id="test2">2️⃣ اختبار Gemini</button>

<div id="status" class="status"></div>
<pre id="out">اضغط على زر للبدء...</pre>

<script>
const API = 'https://qamar-malak-api.onrender.com';
const statusEl = document.getElementById('status');
const outEl = document.getElementById('out');

document.getElementById('test1').addEventListener('click', async () => {
    statusEl.className = 'status loading';
    statusEl.textContent = '⏳ اختبار الخادم...';
    outEl.textContent = 'انتظر 60 ثانية في المرة الأولى...';
    const t0 = Date.now();
    try {
        const res = await fetch(API + '/');
        const text = await res.text();
        const el = ((Date.now() - t0) / 1000).toFixed(1);
        statusEl.className = 'status ok';
        statusEl.textContent = '✅ الخادم يعمل (' + el + 'ث)';
        outEl.textContent = 'Status: ' + res.status + '\n\n' + text;
    } catch (err) {
        statusEl.className = 'status err';
        statusEl.textContent = '❌ فشل الاتصال';
        outEl.textContent = 'Error: ' + err.message;
    }
});

document.getElementById('test2').addEventListener('click', async () => {
    statusEl.className = 'status loading';
    statusEl.textContent = '⏳ اختبار Gemini...';
    outEl.textContent = 'جارٍ الطلب... قد يأخذ 10-30 ثانية.';
    const t0 = Date.now();
    try {
        const res = await fetch(API + '/api/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                query: 'ما حكم الربا؟',
                context: '(لا يوجد سياق)'
            })
        });
        const el = ((Date.now() - t0) / 1000).toFixed(1);
        const text = await res.text();
        if (res.ok) {
            statusEl.className = 'status ok';
            statusEl.textContent = '✅ نجح (' + el + 'ث)';
        } else {
            statusEl.className = 'status err';
            statusEl.textContent = '❌ فشل (HTTP ' + res.status + ')';
        }
        outEl.textContent = 'Status: ' + res.status + '\nTime: ' + el + 's\n\n' + text;
    } catch (err) {
        statusEl.className = 'status err';
        statusEl.textContent = '❌ فشل الاتصال';
        outEl.textContent = 'Error: ' + err.message;
    }
});
</script>
</body>
</html>
