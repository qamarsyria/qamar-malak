<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التفسير المعتمد — ملاك المعرفة</title>
<meta name="description" content="تفسير القرآن الكريم من أصح كتب التفسير: التفسير الميسر، تفسير السعدي، تفسير ابن كثير، تفسير البغوي، وتفسير الطبري.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<meta name="theme-color" content="#0b4133">
<style>
.tafsir-hero {
    background: var(--bg-card);
    border: 1.5px solid var(--border-strong);
    border-radius: 20px;
    padding: 32px 20px;
    text-align: center;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
}
.tafsir-hero h1 {
    font-family: 'Amiri', serif;
    font-size: 32px;
    color: var(--text-accent);
    margin-bottom: 10px;
}
.tafsir-hero p {
    color: var(--text-muted);
    max-width: 720px;
    margin: 0 auto;
    font-size: 14.5px;
    line-height: 1.85;
}

.search-box {
    max-width: 520px;
    margin: 0 auto 22px;
    position: relative;
}
.search-box input {
    width: 100%;
    padding: 14px 48px 14px 18px;
    background: var(--bg-input);
    border: 2px solid var(--border-soft);
    border-radius: 30px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.25s;
}
.search-box input:focus { border-color: var(--gold); }
.search-box .search-icon {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-accent);
    font-size: 18px;
    pointer-events: none;
}

.surah-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px;
}
.surah-card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 15px;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.25s;
    cursor: pointer;
}
.surah-card:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
    box-shadow: var(--shadow-gold);
}
.surah-number {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: var(--text-on-gold);
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    font-family: 'Amiri', serif;
    transform: rotate(45deg);
}
.surah-number span { transform: rotate(-45deg); }
.surah-info { flex: 1; min-width: 0; }
.surah-name {
    font-family: 'Amiri', serif;
    font-size: 20px;
    color: var(--text-accent);
    margin-bottom: 2px;
}
.surah-meta { font-size: 12px; color: var(--text-muted); }

.viewer-container { display: none; }
.viewer-container.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.tafsir-nav {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}
.nav-btn {
    flex: 1;
    min-width: 130px;
    padding: 11px 15px;
    background: var(--bg-panel);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    color: var(--text-accent);
    text-align: center;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
}
.nav-btn:hover:not(:disabled) {
    background: var(--gold);
    color: var(--text-on-gold);
}
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.tafsir-header {
    background: var(--bg-card);
    border: 1.5px solid var(--border-strong);
    border-radius: 18px;
    padding: 22px 18px;
    margin-bottom: 18px;
    text-align: center;
}
.tafsir-header h2 {
    font-family: 'Amiri', serif;
    font-size: 29px;
    color: var(--text-accent);
    margin-bottom: 6px;
}
.tafsir-header .meta { color: var(--text-muted); font-size: 14px; }

.tafsir-toolbar {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 22px;
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 14px;
    align-items: end;
}
.tool-field label {
    display: block;
    color: var(--text-accent);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
}
.tool-field select,
.tool-field input {
    width: 100%;
    padding: 11px 14px;
    background: var(--bg-input);
    border: 1.5px solid var(--border-soft);
    border-radius: 10px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 14px;
    outline: none;
}
.tool-field select:focus,
.tool-field input:focus { border-color: var(--gold); }

.jump-row {
    display: flex;
    gap: 8px;
}
.jump-btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: var(--text-on-gold);
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
}

.ayah-tafsir-card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-right: 4px solid var(--gold);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
}
.ayah-text {
    font-family: 'Amiri', 'Scheherazade New', serif;
    font-size: 24px;
    line-height: 2.15;
    color: var(--text-main);
    text-align: justify;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px dashed var(--border-soft);
}
.ayah-number-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: var(--text-on-gold);
    border-radius: 50%;
    font-family: 'Amiri', serif;
    font-weight: 700;
    font-size: 13px;
    margin-right: 8px;
    vertical-align: middle;
}
.tafsir-content {
    color: var(--text-main);
    line-height: 1.95;
    font-size: 16.5px;
    text-align: justify;
}
.tafsir-content-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
}
.tafsir-content-head strong {
    color: var(--text-accent);
    font-family: 'Amiri', serif;
    font-size: 18px;
}
.copy-tafsir-btn {
    padding: 4px 12px;
    border-radius: 14px;
    border: 1px solid var(--border-soft);
    background: var(--bg-panel);
    color: var(--text-accent);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}
.copy-tafsir-btn:hover { background: var(--gold); color: var(--text-on-gold); }

.merged-note {
    font-size: 13.5px;
    color: var(--text-muted);
    font-style: italic;
}

.loading {
    text-align: center;
    padding: 45px 20px;
    color: var(--text-accent);
}
.spinner {
    display: inline-block;
    width: 40px;
    height: 40px;
    border: 3px solid var(--border-soft);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.t-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #059669;
    color: #fff;
    padding: 9px 20px;
    border-radius: 24px;
    font-size: 13.5px;
    font-weight: 700;
    z-index: 3500;
    display: none;
}
.t-toast.show { display: block; }

@media (max-width: 720px) {
    .tafsir-toolbar { grid-template-columns: 1fr; }
    .tafsir-hero h1 { font-size: 24px; }
    .ayah-text { font-size: 20px; }
    .surah-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="app-header"></div>
<div id="app-nav"></div>

<main class="main-container">

<div id="list-view">
    <section class="tafsir-hero">
        <h1>📘 التفسير المعتمد للقرآن الكريم</h1>
        <p>اختر سورةً للقراءة من أصح كتب التفسير الموثوقة: التفسير الميسّر، وتفسير السعدي، وتفسير ابن كثير، وتفسير البغوي، وتفسير الطبري.</p>
    </section>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="ابحث عن سورة بالاسم أو الرقم...">
        <span class="search-icon">🔍</span>
    </div>

    <div id="surahs-container">
        <div class="loading"><div class="spinner"></div><div>جارٍ تحميل قائمة السور...</div></div>
    </div>
</div>

<div id="viewer-view" class="viewer-container">
    <div class="tafsir-nav">
        <button type="button" class="nav-btn" id="back-btn">📋 قائمة السور</button>
        <button type="button" class="nav-btn" id="prev-btn">◀ السورة السابقة</button>
        <button type="button" class="nav-btn" id="next-btn">السورة التالية ▶</button>
    </div>

    <div class="tafsir-header">
        <h2 id="tafsir-surah-name">—</h2>
        <div class="meta" id="tafsir-surah-meta">—</div>
    </div>

    <div class="tafsir-toolbar">
        <div class="tool-field">
            <label for="tafsir-select">📖 اختر التفسير:</label>
            <select id="tafsir-select"></select>
        </div>
        <div class="tool-field">
            <label for="jump-ayah-input">🎯 انتقال سريع إلى آية:</label>
            <div class="jump-row">
                <input type="number" id="jump-ayah-input" min="1" placeholder="رقم الآية">
                <button type="button" class="jump-btn" id="jump-ayah-btn">انتقال</button>
            </div>
        </div>
    </div>

    <div id="ayahs-tafsir-container"></div>
</div>

</main>

<footer id="app-footer"></footer>
<div class="t-toast" id="t-toast">✓ تم نسخ الآية والتفسير</div>

<script src="layout.js"></script>
<script>
(function () {
'use strict';

const QURAN_API = 'https://api.alquran.cloud/v1';
const TAFSIR_CDN = 'https://cdn.jsdelivr.net/gh/spa5k/tafsir_api@main/tafsir';

const EDITIONS = [
    { id: 'ar-tafsir-muyassar', name: 'التفسير الميسّر (مجمع الملك فهد)', cloudFallback: 'ar.muyassar' },
    { id: 'ar-tafseer-al-saddi', name: 'تيسير الكريم الرحمن (العلامة عبد الرحمن السعدي)' },
    { id: 'ar-tafsir-ibn-kathir', name: 'تفسير القرآن العظيم (الحافظ ابن كثير)' },
    { id: 'ar-tafsir-al-baghawi', name: 'معالم التنزيل (الإمام البغوي)' },
    { id: 'ar-tafsir-al-tabari',  name: 'جامع البيان (الإمام الطبري)' }
];

let allSurahs = [];
let currentSurah = null;
let currentSurahNum = 0;
let currentEdition = EDITIONS[0].id;
let currentSearch = '';
const tafsirCache = {};

function $(id) { return document.getElementById(id); }

function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = String(t || '');
    return d.innerHTML;
}

function showToast(msg) {
    const t = $('t-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function initEditionSelect() {
    const sel = $('tafsir-select');
    sel.innerHTML = EDITIONS.map(e =>
        `<option value="${e.id}">${escapeHtml(e.name)}</option>`
    ).join('');
    sel.value = currentEdition;
}

async function loadSurahs() {
    try {
        const res = await fetch(`${QURAN_API}/surah`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allSurahs = data.data || [];
        renderSurahs();

        const p = new URLSearchParams(window.location.search);
        const n = parseInt(p.get('n') || p.get('surah'), 10);
        if (!isNaN(n) && n >= 1 && n <= 114) {
            openSurah(n);
        }
    } catch (e) {
        $('surahs-container').innerHTML =
            '<div style="text-align:center;padding:40px;color:var(--text-muted);">⚠️ تعذر تحميل قائمة السور. تأكد من اتصالك بالإنترنت.</div>';
    }
}

function renderSurahs() {
    const container = $('surahs-container');
    const q = currentSearch.trim();
    const filtered = allSurahs.filter(s =>
        q === '' ||
        s.name.includes(q) ||
        s.englishName.toLowerCase().includes(q.toLowerCase()) ||
        s.number.toString() === q
    );

    if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد سور مطابقة للبحث.</div>';
        return;
    }

    container.innerHTML = '<div class="surah-grid">' + filtered.map(s => `
        <div class="surah-card" data-surah="${s.number}">
            <div class="surah-number"><span>${s.number}</span></div>
            <div class="surah-info">
                <div class="surah-name">${escapeHtml(s.name.replace('سُورَةُ ', ''))}</div>
                <div class="surah-meta">${escapeHtml(s.revelationType)} · ${s.numberOfAyahs} آية</div>
            </div>
        </div>
    `).join('') + '</div>';

    container.querySelectorAll('.surah-card').forEach(card => {
        card.addEventListener('click', () => openSurah(parseInt(card.dataset.surah, 10)));
    });
}

async function fetchTafsirMap(surahNum, editionId) {
    const cacheKey = `${surahNum}_${editionId}`;
    if (tafsirCache[cacheKey]) return tafsirCache[cacheKey];

    const editionMeta = EDITIONS.find(e => e.id === editionId) || EDITIONS[0];
    const map = {};

    try {
        const res = await fetch(`${TAFSIR_CDN}/${editionId}/${surahNum}.json`);
        if (!res.ok) throw new Error('CDN ' + res.status);
        const data = await res.json();
        const list = Array.isArray(data.ayahs) ? data.ayahs : [];
        list.forEach(item => {
            if (item && item.ayah && item.text) {
                map[item.ayah] = String(item.text).trim();
            }
        });
        tafsirCache[cacheKey] = map;
        return map;
    } catch (err) {
        if (editionMeta.cloudFallback) {
            const res2 = await fetch(`${QURAN_API}/surah/${surahNum}/${editionMeta.cloudFallback}`);
            if (!res2.ok) throw err;
            const data2 = await res2.json();
            (data2.data.ayahs || []).forEach(a => {
                map[a.numberInSurah] = String(a.text || '').trim();
            });
            tafsirCache[cacheKey] = map;
            return map;
        }
        throw err;
    }
}

async function openSurah(num) {
    currentSurahNum = num;
    $('list-view').style.display = 'none';
    $('viewer-view').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });

    $('prev-btn').disabled = num <= 1;
    $('next-btn').disabled = num >= 114;

    $('tafsir-surah-name').textContent = 'جارٍ التحميل...';
    $('tafsir-surah-meta').textContent = '';
    $('ayahs-tafsir-container').innerHTML =
        '<div class="loading"><div class="spinner"></div><div>جارٍ تحميل السورة والتفسير...</div></div>';

    try {
        const res = await fetch(`${QURAN_API}/surah/${num}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        currentSurah = data.data;

        $('tafsir-surah-name').textContent = `سورة ${currentSurah.name.replace('سُورَةُ ', '')}`;
        $('tafsir-surah-meta').textContent = `${currentSurah.revelationType} · ${currentSurah.numberOfAyahs} آية · ترتيبها ${currentSurah.number}`;
        $('jump-ayah-input').max = currentSurah.numberOfAyahs;
        $('jump-ayah-input').value = '';

        await loadAndRenderTafsir();
    } catch (e) {
        $('ayahs-tafsir-container').innerHTML =
            '<div style="text-align:center;padding:40px;color:#f87171;">⚠️ تعذر تحميل السورة. تأكد من اتصالك بالإنترنت.</div>';
    }
}

async function loadAndRenderTafsir() {
    if (!currentSurah) return;
    const container = $('ayahs-tafsir-container');
    container.innerHTML = '<div class="loading"><div class="spinner"></div><div>جارٍ تحميل التفسير المختار...</div></div>';

    const editionMeta = EDITIONS.find(e => e.id === currentEdition) || EDITIONS[0];

    try {
        const tafsirMap = await fetchTafsirMap(currentSurahNum, currentEdition);

        container.innerHTML = currentSurah.ayahs.map(ayah => {
            const rawText = tafsirMap[ayah.numberInSurah];
            const cleanTafsir = rawText
                ? escapeHtml(rawText).replace(/\n/g, '<br>')
                : '<span class="merged-note">تفسير هذه الآية مدمج ضمن مقطع الآيات السابقة أعلاه في هذا التفسير؛ ويمكنك اختيار «التفسير الميسّر» للوقوف على معنى كل آية مستقلة.</span>';

            return `
                <article class="ayah-tafsir-card" id="tafsir-ayah-card-${ayah.numberInSurah}">
                    <div class="ayah-text">
                        ${escapeHtml(ayah.text)}
                        <span class="ayah-number-badge">${ayah.numberInSurah}</span>
                    </div>
                    <div class="tafsir-content">
                        <div class="tafsir-content-head">
                            <strong>📘 ${escapeHtml(editionMeta.name)}:</strong>
                            ${rawText ? `<button type="button" class="copy-tafsir-btn" data-ayah="${ayah.numberInSurah}">📋 نسخ</button>` : ''}
                        </div>
                        <div>${cleanTafsir}</div>
                    </div>
                </article>
            `;
        }).join('');

        container.querySelectorAll('.copy-tafsir-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const n = parseInt(btn.dataset.ayah, 10);
                const ayahObj = currentSurah.ayahs.find(a => a.numberInSurah === n);
                const txt = tafsirMap[n];
                if (!ayahObj || !txt || !navigator.clipboard) return;
                const surahClean = currentSurah.name.replace('سُورَةُ ', '');
                const out = `﴿${ayahObj.text}﴾ [سورة ${surahClean}: ${n}]\n\n${editionMeta.name}:\n${txt}`;
                navigator.clipboard.writeText(out).then(() => showToast('✓ تم نسخ الآية والتفسير'));
            });
        });

    } catch (e) {
        container.innerHTML =
            '<div style="text-align:center;padding:40px;color:#f87171;">⚠️ تعذر تحميل هذا التفسير حاليًا. جرّب اختيار تفسير آخر أو تحقق من الاتصال.</div>';
    }
}

function jumpToAyah() {
    if (!currentSurah) return;
    const n = parseInt($('jump-ayah-input').value, 10);
    if (isNaN(n) || n < 1 || n > currentSurah.numberOfAyahs) return;
    const el = $('tafsir-ayah-card-' + n);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function backToList() {
    $('viewer-view').classList.remove('active');
    $('list-view').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('search-input').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderSurahs();
});

$('tafsir-select').addEventListener('change', (e) => {
    currentEdition = e.target.value;
    loadAndRenderTafsir();
});

$('jump-ayah-btn').addEventListener('click', jumpToAyah);
$('jump-ayah-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') jumpToAyah();
});

$('back-btn').addEventListener('click', backToList);
$('prev-btn').addEventListener('click', () => { if (currentSurahNum > 1) openSurah(currentSurahNum - 1); });
$('next-btn').addEventListener('click', () => { if (currentSurahNum < 114) openSurah(currentSurahNum + 1); });

initEditionSelect();
loadSurahs();

})();
</script>
</body>
</html>
