<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المكتبة الداخلية — ملاك المعرفة</title>
<meta name="description" content="المكتبة الإسلامية الداخلية لمنصة ملاك المعرفة: اقرأ المتون والكتب الموثقة مباشرة داخل المنصة بدون روابط خارجية.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<meta name="theme-color" content="#0b4133">
<style>
.lib-hero {
    background: var(--bg-card);
    border: 1.5px solid var(--border-strong);
    border-radius: 20px;
    padding: 32px 20px;
    text-align: center;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
}
.lib-hero h1 {
    font-family: 'Amiri', serif;
    font-size: 32px;
    color: var(--text-accent);
    margin-bottom: 10px;
}
.lib-hero p {
    color: var(--text-muted);
    max-width: 720px;
    margin: 0 auto;
    font-size: 14.5px;
    line-height: 1.85;
}
.lib-stats {
    display: flex;
    justify-content: center;
    gap: 28px;
    flex-wrap: wrap;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed var(--border-soft);
}
.lib-stat .num {
    font-family: 'Amiri', serif;
    font-size: 26px;
    color: var(--text-accent);
    font-weight: 700;
    display: block;
    line-height: 1.1;
}
.lib-stat .lbl { font-size: 12px; color: var(--text-muted); }

.lib-controls {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 26px;
}
.lib-search {
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
    position: relative;
}
.lib-search input {
    width: 100%;
    padding: 14px 48px 14px 18px;
    background: var(--bg-input);
    border: 2px solid var(--border-soft);
    border-radius: 30px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: all 0.25s;
}
.lib-search input:focus { border-color: var(--gold); }
.lib-search .icon {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-accent);
    font-size: 18px;
    pointer-events: none;
}

.lib-filters {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
}
.lib-filter-btn {
    padding: 8px 16px;
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    color: var(--text-main);
    border-radius: 22px;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.lib-filter-btn:hover,
.lib-filter-btn.active {
    background: var(--gold);
    color: var(--text-on-gold);
    border-color: var(--gold);
}

.cat-heading {
    font-family: 'Amiri', serif;
    font-size: 23px;
    color: var(--text-accent);
    margin: 30px 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.cat-heading span.cnt { font-size: 13px; color: var(--text-muted); font-family: 'Tajawal', sans-serif; }

.books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 16px;
}

.book-card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: all 0.25s ease;
    position: relative;
}
.book-card.ready:hover {
    transform: translateY(-4px);
    border-color: var(--gold);
    box-shadow: var(--shadow-gold);
}
.book-card.soon {
    opacity: 0.78;
}
.book-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}
.book-icon { font-size: 30px; line-height: 1; }
.book-status {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 700;
}
.book-status.ready {
    background: rgba(16, 185, 129, 0.18);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.4);
}
html[data-theme="light"] .book-status.ready {
    color: #047857;
}
.book-status.soon {
    background: rgba(212, 175, 55, 0.14);
    color: var(--text-accent);
    border: 1px solid var(--border-soft);
}
.book-title {
    font-family: 'Amiri', serif;
    font-size: 21px;
    color: var(--text-accent);
    line-height: 1.4;
    font-weight: 700;
}
.book-author {
    font-size: 13px;
    color: var(--text-main);
    font-weight: 600;
    opacity: 0.9;
}
.book-desc {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.75;
    flex: 1;
}
.book-meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px dashed var(--border-soft);
    font-size: 12px;
    color: var(--text-muted);
}
.book-open-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 11px 16px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: var(--text-on-gold);
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    margin-top: 4px;
    transition: transform 0.2s;
}
.book-open-btn:hover { transform: translateY(-2px); }

.book-progress-note {
    font-size: 11.5px;
    color: #34d399;
    font-weight: 600;
}
html[data-theme="light"] .book-progress-note { color: #047857; }

.empty-lib {
    text-align: center;
    padding: 45px 20px;
    color: var(--text-muted);
}

@media (max-width: 640px) {
    .lib-hero h1 { font-size: 24px; }
    .books-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="app-header"></div>
<div id="app-nav"></div>

<main class="main-container">

<section class="lib-hero">
    <h1>📚 المكتبة الإسلامية الداخلية</h1>
    <p>مكتبة محقّقة تفتح وتُقرأ بالكامل داخل منصة ملاك المعرفة بدون أي روابط خارجية — تضم متون العقيدة الصحيحة، والسنة النبوية، وتفسير القرآن، والفقه، والزهد والرقائق، والسيرة.</p>
    <div class="lib-stats">
        <div class="lib-stat"><span class="num" id="stat-ready">0</span><span class="lbl">كتب متاحة للقراءة الآن</span></div>
        <div class="lib-stat"><span class="num" id="stat-total">0</span><span class="lbl">إجمالي خطة المكتبة</span></div>
        <div class="lib-stat"><span class="num">100%</span><span class="lbl">قراءة داخل المنصة</span></div>
    </div>
</section>

<section class="lib-controls">
    <div class="lib-search">
        <input type="text" id="lib-search-input" placeholder="ابحث عن كتاب أو مؤلف أو موضوع...">
        <span class="icon">🔍</span>
    </div>
    <div class="lib-filters" id="lib-filters"></div>
</section>

<div id="lib-content"></div>

</main>

<footer id="app-footer"></footer>

<script src="layout.js"></script>
<script src="data/books/catalog.js"></script>
<script>
(function () {
'use strict';

if (!window.MALAK_BOOKS_CATALOG) {
    document.getElementById('lib-content').innerHTML =
        '<div class="empty-lib">⚠️ تعذر تحميل فهرس المكتبة (data/books/catalog.js).</div>';
    return;
}

const CATALOG = window.MALAK_BOOKS_CATALOG;
let currentCategory = 'all';
let currentSearch = '';
let onlyReady = false;

function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = String(t || '');
    return d.innerHTML;
}

function getSavedChapter(bookId) {
    try {
        const raw = localStorage.getItem('malak_book_pos_' + bookId);
        if (!raw) return null;
        return JSON.parse(raw);
    } catch (e) {
        return null;
    }
}

function updateStats() {
    const readyCount = CATALOG.books.filter(b => b.ready).length;
    document.getElementById('stat-ready').textContent = readyCount;
    document.getElementById('stat-total').textContent = CATALOG.books.length;
}

function renderFilters() {
    const wrap = document.getElementById('lib-filters');
    const btns = [
        `<button type="button" class="lib-filter-btn ${currentCategory === 'all' && !onlyReady ? 'active' : ''}" data-cat="all">📚 الكل</button>`,
        `<button type="button" class="lib-filter-btn ${onlyReady ? 'active' : ''}" data-ready="1">✅ المتاح للقراءة الآن</button>`
    ];
    CATALOG.categories.forEach(cat => {
        const active = currentCategory === cat.id && !onlyReady ? 'active' : '';
        btns.push(`<button type="button" class="lib-filter-btn ${active}" data-cat="${escapeHtml(cat.id)}">${cat.icon} ${escapeHtml(cat.title)}</button>`);
    });
    wrap.innerHTML = btns.join('');

    wrap.querySelectorAll('.lib-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.dataset.ready) {
                onlyReady = !onlyReady;
                if (onlyReady) currentCategory = 'all';
            } else {
                onlyReady = false;
                currentCategory = btn.dataset.cat;
            }
            renderFilters();
            renderBooks();
        });
    });
}

function renderBooks() {
    const container = document.getElementById('lib-content');
    const q = currentSearch.trim();

    const matchedBooks = CATALOG.books.filter(b => {
        if (onlyReady && !b.ready) return false;
        if (currentCategory !== 'all' && b.category !== currentCategory) return false;
        if (!q) return true;
        const hay = `${b.title} ${b.author} ${b.desc} ${(b.tags || []).join(' ')}`;
        return hay.includes(q);
    });

    if (matchedBooks.length === 0) {
        container.innerHTML = '<div class="empty-lib">🔍 لا توجد كتب مطابقة لبحثك حاليًا.</div>';
        return;
    }

    let html = '';
    CATALOG.categories.forEach(cat => {
        const list = matchedBooks.filter(b => b.category === cat.id);
        if (list.length === 0) return;

        html += `
            <h2 class="cat-heading">
                <span>${cat.icon} ${escapeHtml(cat.title)}</span>
                <span class="cnt">${list.length} ${list.length === 1 ? 'كتاب' : 'كتب'}</span>
            </h2>
            <div class="books-grid">
                ${list.map(renderBookCard).join('')}
            </div>
        `;
    });

    container.innerHTML = html;
}

function renderBookCard(book) {
    const saved = book.ready ? getSavedChapter(book.id) : null;
    const progressText = saved && saved.chapterTitle
        ? `<div class="book-progress-note">📍 آخر قراءة: ${escapeHtml(saved.chapterTitle)}</div>`
        : '';

    return `
        <article class="book-card ${book.ready ? 'ready' : 'soon'}">
            <div class="book-top">
                <span class="book-icon">${book.icon || '📖'}</span>
                <span class="book-status ${book.ready ? 'ready' : 'soon'}">
                    ${book.ready ? '✅ متاح للقراءة الآن' : '⏳ يُضاف في الدفعات القادمة'}
                </span>
            </div>
            <h3 class="book-title">${escapeHtml(book.title)}</h3>
            <div class="book-author">✍️ ${escapeHtml(book.author)}</div>
            <p class="book-desc">${escapeHtml(book.desc)}</p>
            ${progressText}
            <div class="book-meta-row">
                <span>📑 ${book.chaptersCount ? book.chaptersCount + ' فصول' : 'متن محقّق'}</span>
                <span>🛡️ موثّق ومخرّج</span>
            </div>
            ${book.ready
                ? `<a href="book-reader.html?book=${encodeURIComponent(book.id)}" class="book-open-btn">📖 اقرأ الكتاب داخل المنصة ←</a>`
                : `<div style="text-align:center;font-size:12px;color:var(--text-muted);padding:8px;border:1px dashed var(--border-soft);border-radius:10px;">قيد التحقيق والتدقيق الحديثي</div>`
            }
        </article>
    `;
}

document.getElementById('lib-search-input').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderBooks();
});

updateStats();
renderFilters();
renderBooks();

})();
</script>
</body>
</html>
