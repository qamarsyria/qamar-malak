<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>فيديوهات ملاك المعرفة</title>
<link rel="stylesheet" href="style.css">
<style>
    body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: 'Tajawal', sans-serif; }
    .feed-container { height: 100vh; width: 100vw; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
    .feed-container::-webkit-scrollbar { display: none; }
    .video-card { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; background-color: #000; }
    
    .telegram-player { width: 100%; height: 100%; border: none; }
    
    .video-info { position: absolute; bottom: 60px; right: 0; left: 0; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); color: #fff; pointer-events: none; }
    .video-title { font-family: 'Amiri', serif; font-size: 22px; font-weight: bold; color: #D4AF37; margin-bottom: 8px; text-shadow: 1px 1px 2px #000; }
    .video-desc { font-size: 13px; line-height: 1.6; opacity: 0.9; text-shadow: 1px 1px 2px #000; }
    .video-category { display: inline-block; background: rgba(212, 175, 55, 0.2); color: #D4AF37; border: 1px solid #D4AF37; padding: 3px 10px; border-radius: 12px; font-size: 12px; margin-bottom: 10px; }

    .actions-column {
        position: absolute;
        bottom: 100px;
        left: 15px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 100;
    }
    .action-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: #fff;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        cursor: pointer;
        transition: transform 0.2s;
        background: none;
        border: none;
        font-family: inherit;
        font-size: 12px;
    }
    .action-btn:hover { transform: scale(1.15); }
    .action-btn .icon {
        font-size: 32px;
        width: 55px;
        height: 55px;
        background: rgba(0,0,0,0.5);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(212,175,55,0.4);
    }
    .action-btn .count {
        font-family: 'Amiri', serif;
        font-weight: bold;
        color: #D4AF37;
        font-size: 14px;
    }
    .action-btn.liked .icon {
        background: rgba(212,175,55,0.8);
        border-color: #D4AF37;
    }
    .action-btn.liked .count { color: #D4AF37; }

    .share-menu {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #1a1a1a;
        border-top: 2px solid #D4AF37;
        padding: 20px;
        z-index: 200;
        transform: translateY(100%);
        transition: transform 0.3s ease;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .share-menu.show { transform: translateY(0); }
    .share-menu h3 { color: #D4AF37; font-family: 'Amiri', serif; font-size: 18px; margin-bottom: 10px; text-align: center; }
    .share-option { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(212,175,55,0.1); border-radius: 10px; color: #fff; text-decoration: none; cursor: pointer; border: 1px solid rgba(212,175,55,0.3); transition: all 0.2s; }
    .share-option:hover { background: rgba(212,175,55,0.3); }
    .share-option .icon { font-size: 24px; }
    .share-option .label { font-family: 'Amiri', serif; font-size: 16px; }
    .share-menu .close-btn { background: #D4AF37; color: #000; border: none; padding: 12px; border-radius: 10px; font-family: 'Amiri', serif; font-size: 16px; cursor: pointer; margin-top: 10px; }
    .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; display: none; }
    .backdrop.show { display: block; }

    .back-btn { position: fixed; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.5); color: #fff; border: 1px solid rgba(255,255,255,0.2); width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; z-index: 1000; backdrop-filter: blur(5px); text-decoration: none; }

    .loading-screen { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #0d4d3c; color: #D4AF37; }
    .spinner { width: 50px; height: 50px; border: 5px solid rgba(212, 175, 55, 0.2); border-top-color: #D4AF37; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }
    .action-btn.pop .icon { animation: pop 0.4s ease; }
</style>
</head>
<body>

<a href="index.html" class="back-btn">↩</a>

<div id="loading" class="loading-screen">
    <div class="spinner"></div>
    <p>جاري تحميل الفيديوهات...</p>
</div>

<div id="feed" class="feed-container" style="display: none;"></div>

<div class="backdrop" id="backdrop" onclick="closeShareMenu()"></div>

<div class="share-menu" id="share-menu">
    <h3>🎁 أهدِ حسنة</h3>
    <a class="share-option" onclick="shareTo('whatsapp')">
        <span class="icon">📱</span>
        <span class="label">واتساب</span>
    </a>
    <a class="share-option" onclick="shareTo('telegram')">
        <span class="icon">✈️</span>
        <span class="label">تلغرام</span>
    </a>
    <a class="share-option" onclick="shareTo('facebook')">
        <span class="icon">📘</span>
        <span class="label">فيسبوك</span>
    </a>
    <a class="share-option" onclick="shareTo('copy')">
        <span class="icon">🔗</span>
        <span class="label">نسخ الرابط</span>
    </a>
    <button class="close-btn" onclick="closeShareMenu()">إغلاق</button>
</div>

<script>
    const FEED_API_URL = 'videos.json';
    const SITE_URL = 'https://qamarsyria.github.io/qamar-malak/';
    let currentShareVideo = null;

    function showError(msg) {
        const loading = document.getElementById('loading');
        loading.innerHTML = `<div style="color:#ff8888; text-align:center; padding:20px;">
            <h2 style="font-family:Amiri,serif; font-size:24px;">⚠️ حدث خطأ</h2>
            <p style="line-height:1.8; margin-top:10px;">${msg}</p>
            <button onclick="location.reload()" style="margin-top:20px; padding:10px 20px; border-radius:8px; border:none; background:#D4AF37; color:#000; font-weight:bold; cursor:pointer;">إعادة المحاولة</button>
        </div>`;
    }

    // 🔢 نظام الحفظ الهجين
    function getLocalCount(videoId, type) {
        const key = `count_${videoId}_${type}`;
        return parseInt(localStorage.getItem(key) || '0', 10);
    }

    function incrementLocalCount(videoId, type) {
        const key = `count_${videoId}_${type}`;
        const current = getLocalCount(videoId, type);
        localStorage.setItem(key, String(current + 1));
        return current + 1;
    }

    async function loadVideos() {
        const feedContainer = document.getElementById('feed');
        const loadingScreen = document.getElementById('loading');

        try {
            const response = await fetch(FEED_API_URL);
            if (!response.ok) throw new Error(`فشل قراءة ملف الفيديوهات.`);

            const videos = await response.json();
            loadingScreen.style.display = 'none';
            feedContainer.style.display = 'block';

            if (!videos || videos.length === 0) {
                feedContainer.innerHTML = `
                    <div class="video-card" style="flex-direction:column; color:#D4AF37; text-align:center;">
                        <h2 style="font-family:Amiri,serif; font-size:28px; margin-bottom:10px;">لا توجد فيديوهات بعد</h2>
                        <p style="opacity:0.8;">سيقوم المصنع برفع الفيديوهات هنا قريباً جداً بمشيئة الله.</p>
                        <a href="index.html" style="margin-top:20px; padding:10px 20px; background:#D4AF37; color:#000; text-decoration:none; border-radius:8px; font-weight:bold;">العودة للرئيسية</a>
                    </div>
                `;
                return;
            }

            const recentVideos = videos.slice(0, 50);

            let html = '';
            recentVideos.forEach((video) => {
                const isTelegramId = /^\d+$/.test(video.video_url);
                const videoId = video.video_url;
                
                const baseViews = video.views || 0;
                const baseLikes = video.likes || 0;
                const baseShares = video.shares || 0;
                
                const localLikes = getLocalCount(videoId, 'like');
                const localShares = getLocalCount(videoId, 'share');
                const localViews = getLocalCount(videoId, 'view');
                
                const totalViews = baseViews + localViews;
                const totalLikes = baseLikes + localLikes;
                const totalShares = baseShares + localShares;
                
                const hasLiked = localStorage.getItem(`liked_${videoId}`) === '1';

                if (isTelegramId) {
                    const telegramEmbed = `https://t.me/malak_almarifa/${video.video_url}?embed=1`;
                    html += `
                        <div class="video-card" data-video-id="${videoId}">
                            <iframe class="telegram-player" src="${telegramEmbed}" allowfullscreen></iframe>
                            
                            <div class="actions-column">
                                <button class="action-btn ${hasLiked ? 'liked' : ''}" onclick="likeVideo('${videoId}', this)">
                                    <span class="icon">✨</span>
                                    <span class="count" id="likes-${videoId}">${totalLikes.toLocaleString('ar-EG')}</span>
                                </button>
                                <button class="action-btn" onclick="openShareMenu('${videoId}', '${(video.title || '').replace(/'/g, "\\'")}')">
                                    <span class="icon">🎁</span>
                                    <span class="count" id="shares-${videoId}">${totalShares.toLocaleString('ar-EG')}</span>
                                </button>
                                <div class="action-btn" style="cursor:default;">
                                    <span class="icon">👁️</span>
                                    <span class="count" id="views-${videoId}">${totalViews.toLocaleString('ar-EG')}</span>
                                </div>
                            </div>
                            
                            <div class="video-info">
                                ${video.category ? `<span class="video-category">${video.category}</span>` : ''}
                                <div class="video-title">${video.title || 'بدون عنوان'}</div>
                                <div class="video-desc">${video.description || ''}</div>
                            </div>
                        </div>
                    `;
                }
            });

            feedContainer.innerHTML = html;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const videoId = entry.target.dataset.videoId;
                        const viewsEl = document.getElementById(`views-${videoId}`);
                        if (viewsEl && !entry.target.dataset.viewed) {
                            entry.target.dataset.viewed = '1';
                            const newViews = incrementLocalCount(videoId, 'view');
                            const baseViews = parseInt(viewsEl.textContent.replace(/,/g, '')) || 0;
                            viewsEl.textContent = (baseViews + 1).toLocaleString('ar-EG');
                        }
                    }
                });
            }, { threshold: 0.6 });

            document.querySelectorAll('.video-card').forEach(card => observer.observe(card));

        } catch (err) {
            showError(err.message);
        }
    }

    function likeVideo(videoId, btn) {
        if (localStorage.getItem(`liked_${videoId}`) === '1') {
            return;
        }
        
        const countEl = document.getElementById(`likes-${videoId}`);
        const baseLikes = parseInt(countEl.textContent.replace(/,/g, '')) || 0;
        
        incrementLocalCount(videoId, 'like');
        countEl.textContent = (baseLikes + 1).toLocaleString('ar-EG');
        localStorage.setItem(`liked_${videoId}`, '1');
        btn.classList.add('liked', 'pop');
        
        setTimeout(() => btn.classList.remove('pop'), 400);
    }

    function openShareMenu(videoId, videoTitle) {
        currentShareVideo = { id: videoId, title: videoTitle };
        document.getElementById('backdrop').classList.add('show');
        document.getElementById('share-menu').classList.add('show');
    }

    function closeShareMenu() {
        document.getElementById('backdrop').classList.remove('show');
        document.getElementById('share-menu').classList.remove('show');
    }

    function shareTo(platform) {
        if (!currentShareVideo) return;
        
        const videoUrl = `${SITE_URL}feed.html`;
        const text = `🎁 أهديك هذه الحسنة: ${currentShareVideo.title}\n\n${videoUrl}`;
        
        const countEl = document.getElementById(`shares-${currentShareVideo.id}`);
        if (countEl) {
            const baseShares = parseInt(countEl.textContent.replace(/,/g, '')) || 0;
            incrementLocalCount(currentShareVideo.id, 'share');
            countEl.textContent = (baseShares + 1).toLocaleString('ar-EG');
        }
        
        let url = '';
        switch(platform) {
            case 'whatsapp': url = `https://wa.me/?text=${encodeURIComponent(text)}`; break;
            case 'telegram': url = `https://t.me/share/url?url=${encodeURIComponent(videoUrl)}&text=${encodeURIComponent('🎁 أهديك هذه الحسنة')}`; break;
            case 'facebook': url = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(videoUrl)}`; break;
            case 'copy':
                navigator.clipboard.writeText(text).then(() => {
                    alert('✅ تم نسخ الرابط');
                });
                closeShareMenu();
                return;
        }
        
        window.open(url, '_blank');
        closeShareMenu();
    }

    loadVideos();
</script>
</body>
</html>
