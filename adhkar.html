let currentTab = 'morning';
let counters = {};

function getTodayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

function loadCounters() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.day === getTodayKey() && parsed.data) {
            counters = parsed.data;
        } else {
            counters = {};
        }
    } catch (e) {
        counters = {};
    }
}

function saveCounters() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            day: getTodayKey(),
            data: counters
        }));
    } catch (e) {}
}

function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = String(t || '');
    return d.innerHTML;
}

function showToast(msg) {
    const t = document.getElementById('a-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function renderTabs() {
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = Object.keys(ADHKAR_DATA).map(key => `
        <button type="button" class="tab-btn ${key === currentTab ? 'active' : ''}" data-tab="${key}">
            ${ADHKAR_DATA[key].title}
        </button>
    `).join('');

    tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            currentTab = btn.dataset.tab;
            renderTabs();
            renderContent();
        });
    });
}

function updateSectionHeader() {
    const data = ADHKAR_DATA[currentTab];
    const total = data.items.length;
    let doneCount = 0;
    data.items.forEach((item, i) => {
        const key = `${currentTab}-${i}`;
        if ((counters[key] || 0) >= item.count) doneCount++;
    });
    const pct = total ? Math.round((doneCount / total) * 100) : 0;

    document.getElementById('section-header-container').innerHTML = `
        <div class="section-header">
            <div>
                <h2>${escapeHtml(data.title)}</h2>
                <p>${escapeHtml(data.desc)}</p>
            </div>
            <div class="section-progress">
                <div class="progress-label">الإنجاز اليومي: ${doneCount} / ${total} (${pct}%)</div>
                <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
            </div>
        </div>
    `;
}

function renderContent() {
    const data = ADHKAR_DATA[currentTab];
    const containerEl = document.getElementById('adhkar-container');

    updateSectionHeader();

    containerEl.innerHTML = data.items.map((item, i) => {
        const key = `${currentTab}-${i}`;
        const current = counters[key] || 0;
        const done = current >= item.count;
        return `
            <article class="dhikr-card ${done ? 'is-done' : ''}" id="card-${key}">
                <div class="dhikr-text">${escapeHtml(item.text)}</div>
                ${item.benefit ? `<div class="dhikr-benefit">✨ ${escapeHtml(item.benefit)}</div>` : ''}
                <div class="dhikr-meta">
                    <div class="dhikr-source">📚 ${escapeHtml(item.source)}</div>
                    <div class="dhikr-counter">
                        <button type="button" class="counter-btn ${done ? 'done' : ''}"
                                data-key="${key}"
                                data-count="${item.count}"
                                ${done ? 'disabled' : ''}>
                            ${done ? '✓' : '+1'}
                        </button>
                        <div class="counter-display">
                            <span id="count-${key}">${current}</span> / ${item.count}
                        </div>
                        <button type="button" class="mini-action-btn" data-copy="${i}">📋 نسخ</button>
                        <button type="button" class="mini-action-btn reset" data-reset="${key}">↺ إعادة</button>
                    </div>
                </div>
                <div class="done-msg ${done ? 'show' : ''}" id="done-${key}">
                    ✓ أتممت هذا الذكر — تقبّل الله منك
                </div>
            </article>
        `;
    }).join('');

    document.getElementById('section-reset-wrap').innerHTML = `
        <button type="button" class="mini-action-btn reset" id="reset-tab-btn">🔄 تصفير عدّادات هذا القسم</button>
    `;
    document.getElementById('reset-tab-btn').addEventListener('click', () => {
        data.items.forEach((_, i) => {
            delete counters[`${currentTab}-${i}`];
        });
        saveCounters();
        renderContent();
    });
}

document.getElementById('adhkar-container').addEventListener('click', (ev) => {
    const incBtn = ev.target.closest('.counter-btn');
    if (incBtn && !incBtn.disabled) {
        const key = incBtn.dataset.key;
        const target = parseInt(incBtn.dataset.count, 10);
        const current = counters[key] || 0;
        if (current >= target) return;

        counters[key] = current + 1;
        saveCounters();
        document.getElementById('count-' + key).textContent = counters[key];
        if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }

        if (counters[key] >= target) {
            incBtn.classList.add('done');
            incBtn.textContent = '✓';
            incBtn.disabled = true;
            document.getElementById('card-' + key).classList.add('is-done');
            document.getElementById('done-' + key).classList.add('show');
        }
        updateSectionHeader();
        return;
    }

    const resetBtn = ev.target.closest('[data-reset]');
    if (resetBtn) {
        const key = resetBtn.dataset.reset;
        counters[key] = 0;
        saveCounters();
        renderContent();
        return;
    }

    const copyBtn = ev.target.closest('[data-copy]');
    if (copyBtn) {
        const idx = parseInt(copyBtn.dataset.copy, 10);
        const item = ADHKAR_DATA[currentTab].items[idx];
        if (item && navigator.clipboard) {
            const text = `${item.text}\n\n— ${item.source}`;
            navigator.clipboard.writeText(text).then(() => showToast('✓ تم نسخ الذكر مع التخريج'));
        }
    }
});

loadCounters();
renderTabs();
renderContent();

})();
